name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (reporte para el grader de Yura)
        run: pnpm lint:report
        continue-on-error: true

      - name: Tests con cobertura
        run: pnpm test:cov

      - name: Duplicación
        run: pnpm dup
        continue-on-error: true

      - name: Build
        run: pnpm build

      - name: Resumen
        if: always()
        run: |
          echo "### Reporte de calidad" >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage/coverage-summary.json ]; then
            node -pe "
              const c = require('./coverage/coverage-summary.json').total;
              \`- Cobertura de líneas: \${c.lines.pct}%\n- Cobertura de ramas: \${c.branches.pct}%\`
            " >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f eslint-report.json ]; then
            node -pe "
              const r = require('./eslint-report.json');
              const all = r.flatMap(f => f.messages || []);
              const cc = all.filter(m => m.ruleId === 'complexity').length;
              \`- Violaciones de lint: \${all.length}\n- Funciones sobre el umbral de complejidad: \${cc}\`
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefactos de calidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
            eslint-report.json
            .jscpd/jscpd-report.json
          if-no-files-found: warn
